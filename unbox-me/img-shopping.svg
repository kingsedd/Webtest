<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-labelledby="shopTitle">
  <title id="shopTitle">Compra en línea desde el teléfono</title>

  <ellipse cx="150" cy="322" rx="90" ry="12" fill="#5F5A3E" opacity="0.14"/>

  <!-- Caja pequeña flotante -->
  <g transform="translate(206,238) rotate(-8)">
    <rect x="0" y="0" width="54" height="46" rx="5" fill="#F2A26B"/>
    <rect x="0" y="17" width="54" height="8" fill="#F6F1E4"/>
    <rect x="23" y="0" width="8" height="46" fill="#F6F1E4"/>
  </g>

  <!-- Teléfono -->
  <rect x="70" y="20" width="160" height="280" rx="26" fill="#5F5A3E"/>
  <rect x="82" y="42" width="136" height="222" rx="10" fill="#F6F1E4"/>
  <rect x="135" y="30" width="30" height="5" rx="2.5" fill="#8A8362"/>
  <rect x="130" y="272" width="40" height="6" rx="3" fill="#8A8362"/>

  <!-- Bolsa de compras en la pantalla -->
  <path d="M126,138 Q150,102 174,138" fill="none" stroke="#5F5A3E" stroke-width="7" stroke-linecap="round"/>
  <polygon points="118,138 182,138 190,214 110,214" fill="#F2A26B"/>
  <rect x="132" y="168" width="36" height="6" rx="3" fill="#F6F1E4" opacity="0.85"/>
  <rect x="132" y="182" width="24" height="6" rx="3" fill="#F6F1E4" opacity="0.85"/>

  <!-- Insignia de confirmación -->
  <circle cx="196" cy="120" r="20" fill="#5F5A3E"/>
  <path d="M187,120 194,127 207,112" fill="none" stroke="#F6F1E4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Estrella decorativa -->
  <path d="M100,110 l4,10 10,1 -8,7 3,10 -9,-6 -9,6 3,-10 -8,-7 10,-1 z" fill="#D97A3F"/>
</svg>

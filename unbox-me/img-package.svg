<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-labelledby="pkgTitle">
  <title id="pkgTitle">Paquete sellado listo para enviar</title>

  <ellipse cx="150" cy="272" rx="95" ry="14" fill="#5F5A3E" opacity="0.16"/>

  <!-- Cara superior -->
  <polygon points="150,50 230,95 150,140 70,95" fill="#E7E0C7"/>
  <!-- Cara izquierda -->
  <polygon points="70,95 150,140 150,250 70,205" fill="#8A8362"/>
  <!-- Cara derecha -->
  <polygon points="150,140 230,95 230,205 150,250" fill="#5F5A3E"/>

  <!-- Cinta: costura frontal -->
  <polygon points="140,53 160,53 160,247 140,247" fill="#F6F1E4"/>

  <!-- Etiqueta de envío en la cara derecha -->
  <rect x="168" y="150" width="48" height="40" rx="4" fill="#F6F1E4"/>
  <rect x="176" y="160" width="32" height="4" rx="2" fill="#D97A3F"/>
  <rect x="176" y="169" width="24" height="4" rx="2" fill="#B8AE86"/>
  <rect x="176" y="178" width="28" height="4" rx="2" fill="#B8AE86"/>

  <!-- Sello circular en la cara izquierda -->
  <circle cx="108" cy="175" r="20" fill="none" stroke="#F2A26B" stroke-width="3"/>
  <path d="M99,175 106,182 119,166" fill="none" stroke="#F2A26B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

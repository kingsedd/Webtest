<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="unboxLogoTitle">
  <title id="unboxLogoTitle">Unbox Me!</title>

  <!-- Diamante base: caqui — representa la caja vista desde arriba -->
  <polygon points="60,18 100,54 60,90 20,54" fill="#8A8362"/>

  <!-- Diamante superior desplazado: naranja pastel — la solapa que se abre -->
  <polygon points="70,10 100,38 72,64 42,38" fill="#F2A26B"/>

  <!-- Cinta minimalista cruzando la esquina -->
  <rect x="72" y="4" width="12" height="46" rx="3" fill="#F6F1E4" transform="rotate(45 78 27)"/>

  <!-- Línea de pliegue central: sutil, sugiere apertura -->
  <line x1="60" y1="18" x2="60" y2="90" stroke="#5F5A3E" stroke-width="1.4" stroke-linecap="round" opacity="0.35"/>
</svg>
